<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Black Background -->
  <rect width="1400" height="600" fill="#0a0a0a"/>
  
  <!-- Car Outline (Gold) -->
  <g>
    <!-- Main car body outline -->
    <path d="M 100 300 Q 150 150 380 120 L 1020 120 Q 1080 150 1120 300 L 1120 360 Q 1120 390 1080 390 L 120 390 Q 100 390 100 360 Z" 
          fill="none" stroke="#c9a24b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Windshield -->
    <path d="M 360 160 Q 480 190 700 190 Q 900 190 1020 160" 
          fill="none" stroke="#c9a24b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Speed lines (left) -->
    <line x1="260" y1="200" x2="180" y2="240" stroke="#c9a24b" stroke-width="8" stroke-linecap="round"/>
    <line x1="280" y1="260" x2="200" y2="300" stroke="#c9a24b" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Speed line (right) -->
    <line x1="1050" y1="140" x2="1120" y2="100" stroke="#c9a24b" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- BURGER text (Silver) -->
  <text x="330" y="290" font-family="serif" font-size="95" font-weight="bold" fill="#b8b8b8" font-style="italic" letter-spacing="-2">BURGER</text>
  
  <!-- GARAGE text (Gold) -->
  <text x="760" y="290" font-family="serif" font-size="95" font-weight="bold" fill="#c9a24b" font-style="italic" letter-spacing="-2">GARAGE</text>
  
  <!-- Ampersand (&) -->
  <text x="1100" y="290" font-family="serif" font-size="85" font-weight="bold" fill="#c9a24b" font-style="italic">&amp;</text>
  
  <!-- Urdu text -->
  <text x="700" y="430" text-anchor="middle" font-family="serif" font-size="42" fill="#c9a24b" direction="rtl">عشق نالوں برگر چنگا!</text>
  
  <!-- Horizontal line -->
  <line x1="250" y1="460" x2="1100" y2="460" stroke="#c9a24b" stroke-width="2" opacity="0.7"/>
  
  <!-- EST. MOTOR CLUB text -->
  <text x="700" y="510" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#e8e8e8" letter-spacing="3">EST. MOTOR CLUB</text>
  
  <!-- FINE FAST FOOD text -->
  <text x="700" y="545" text-anchor="middle" font-family="monospace" font-size="20" fill="#e8e8e8" letter-spacing="3">FINE FAST FOOD.</text>
  
  <!-- Wrench Icon (right) -->
  <g transform="translate(1180, 420)">
    <rect x="-12" y="-35" width="24" height="45" rx="10" fill="none" stroke="#e8e8e8" stroke-width="4"/>
    <circle cx="0" cy="22" r="13" fill="none" stroke="#e8e8e8" stroke-width="4"/>
  </g>
</svg>